/* VOICE: friendly civic guide, clear and fair, like a good local newspaper on a sunny morning

:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1626);--ink:light-dark(#14213a,#eef2fa);--sub:light-dark(#56627a,#a9b4c9);
--sky:light-dark(#1d5fd0,#3d7ef0);--skyd:light-dark(#0f3f94,#1b3f86);--sun:#ffc93c;--coral:light-dark(#e2553a,#ff7a5c);
--line:light-dark(#dde3ee,#26324a);--soft:light-dark(#eef4ff,#152240);--card:light-dark(#fff,#121d33)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.logo{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--sky)}
button,input,textarea,select{font:inherit;font-size:16px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
html{scroll-padding-top:72px}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding-block:clamp(28px,4vw,56px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;color:var(--ink);text-decoration:none}
.logo small{font-size:11px;font-weight:700;color:var(--sub)}
.hd nav{margin-left:auto;display:flex;gap:4px}
.hd nav a{padding:10px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:700}
.hd nav a.on,.hd nav a:hover{background:var(--soft)}
.hero{background:var(--sky);color:#fff;overflow:hidden}
.hgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(32px,5vw,50px);font-weight:900}
.hero p{color:#e3ecff;max-width:30em}
.zip{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.zip input{flex:1 1 180px;min-height:48px;border-radius:12px;border:0;padding:0 16px;color:#14213a;background:#fff}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--sun);color:#14213a;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:6px}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}

.scene{width:100%;height:auto;display:block}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:-36px;position:relative}
.fc div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 20px #0f3f9414}
.fc b{display:block;font:900 30px/1.1 "Zen Maru Gothic",sans-serif;color:var(--sky)}
.fc span{font-size:13px;color:var(--sub)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ecard{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;transition:transform .15s}
.ecard:hover{transform:translateY(-2px);border-color:var(--sky)}
.ecard h3{font-size:19px;margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--sky);white-space:nowrap}
.tag.hot{background:var(--coral);color:#fff}
.tag.gray{background:light-dark(#5b6170,#3a4459);color:#fff}
.meta{font-size:14px;color:var(--sub)}
.ad{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--sub);font-size:13px;background:light-dark(#fafbfd,#101a2e);margin:16px 0}
.ad b{display:block;font-size:11px;letter-spacing:0;color:var(--sub)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.steps div{background:var(--soft);border-radius:16px;padding:18px}
.steps h3{font-size:18px;margin-bottom:6px}
.cta{background:var(--skyd);color:#fff;border-radius:20px;padding:clamp(20px,4vw,36px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta p{color:#d7e3ff;margin:6px 0 0}
.crumb{font-size:13px;color:var(--sub);padding-top:16px}
.crumb a{color:var(--sub)}
.ehead{border-bottom:4px solid var(--sky);padding:16px 0 20px}
.ehead h1{font-size:clamp(26px,4vw,38px);margin:8px 0}
.kv{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px}
.kv b{color:var(--sub);font-weight:500;margin-right:6px}
.count{display:flex;align-items:center;gap:14px;background:var(--soft);border-radius:16px;padding:14px 18px;margin:16px 0}
.count b{font:900 40px/1 "Zen Maru Gothic";color:var(--coral)}
.cand{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.av{width:110px;height:132px;border-radius:12px;display:block}
.cand h3{font-size:24px}
.kana{font-size:13px;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px;font-size:15px}
.votes{font-weight:700;margin-left:auto;font-size:18px;white-space:nowrap}
.bub{grid-column:1/-1;position:relative;background:var(--sky);color:#fff;font:700 18px/1.5 "Zen Maru Gothic",sans-serif;padding:14px 18px;border-radius:14px;margin-top:6px}
.bub::before{content:"";position:absolute;top:-10px;left:44px;border:10px solid transparent;border-top:0;border-bottom-color:var(--sky)}
.more{grid-column:1/-1;text-align:center;font-weight:700}
.freeinfo{grid-column:1/-1;font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.src{font-size:12px;color:var(--sub);margin-top:16px}
.prof{max-width:760px;margin:0 auto}

.ptop h1{font-size:clamp(30px,5vw,44px)}

.ps{margin-top:28px}

.ps p{margin:6px 0}
.ps ul{padding-left:1.2em;margin:6px 0}

.win{color:var(--coral);font-weight:700}
.sns{display:flex;gap:10px;flex-wrap:wrap}
.sns span{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}
.video{aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,var(--skyd),var(--sky));display:grid;place-items:center;color:#fff;font-weight:700}
.notice{background:light-dark(#fff8e1,#2a2410);border:1px solid light-dark(#f1d27a,#6b5a20);border-radius:14px;padding:16px;margin:20px 0;font-size:14px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.plan{border:2px solid var(--line);border-radius:20px;padding:22px;background:var(--card)}
.plan.rec{border-color:var(--sky);box-shadow:0 10px 30px #1d5fd022}
.plan h3{font-size:22px}
.price{font:900 34px/1.1 "Zen Maru Gothic";margin:10px 0 2px;white-space:nowrap}

.plan ul{padding-left:1.1em;font-size:14px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:10px 8px;font-size:14px}
.cmp td{text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.ok{color:var(--sky);font-weight:900}
.edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.fld{margin-bottom:16px}
.fld label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px}
.fld textarea{min-height:110px}
.lock{font-size:12px;color:var(--coral);font-weight:700;margin-left:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.seg button{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font-weight:700}
.seg button.on{background:var(--sky);color:#fff;border-color:var(--sky)}
.pv{position:sticky;top:76px;border:1px solid var(--line);border-radius:16px;padding:0 16px;background:var(--card)}
.ic{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--ink);padding:0}
.ic:hover{background:var(--soft)}
#drawer{position:fixed;inset:60px 0 0 auto;width:min(320px,100%);background:var(--card);border-left:1px solid var(--line);z-index:6;box-shadow:-10px 0 30px #0002;overflow:auto}
.dr-in a{display:block;padding:16px 20px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
.dr-in a:hover{background:var(--soft)}
.cal-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cal-tabs button,.chips button{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font-weight:700}
.cal-tabs button.on,.chips button.on{background:var(--sky);border-color:var(--sky);color:#fff}
.cal a{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.cal a:hover{background:var(--soft)}
.cal .dt{font:900 26px/1 "Zen Maru Gothic";color:var(--sky);text-align:center;white-space:nowrap}
.cal .dt small{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-top:4px}
.cal strong{display:block;font-size:17px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;align-items:start}
.reg{display:grid;gap:14px}
.reg h3{font-size:15px;color:var(--sub);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px;padding:0 14px;font-size:14px}
.chips button.smp{border-color:var(--sun);background:light-dark(#fff6d8,#2a2410)}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.art{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card);text-align:left;padding:0;color:var(--ink);cursor:pointer}

.art div{padding:12px 14px 16px}
.art h3{font-size:16px;margin:6px 0}
.upd{list-style:none;padding:0;margin:0}
.upd a{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.upd .av{width:48px;height:58px;border-radius:8px}
.upd b{display:block}
.join{background:var(--sun);border-radius:20px;padding:clamp(20px,4vw,36px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center;color:#14213a}
.join h2{font-size:26px}
.join form{display:grid;gap:8px}
.join input{min-height:48px;border-radius:12px;border:0;padding:0 14px;background:#fff;color:#14213a}
.join .btn{background:#14213a;color:#fff}
.sr{position:absolute;left:-9999px}
.res-h{font-size:18px;margin:24px 0 8px}
.cand .av{flex:none}
#app [id^=d-] .av{width:56px;height:67px;border-radius:8px}
.lnk{background:none;border:0;padding:0;color:var(--sky);font-weight:700;text-decoration:underline;cursor:pointer;text-align:left}
.dtab td:nth-child(3){text-align:center}.dtab td:nth-child(2){text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{background:var(--skyd);color:#d7e3ff;margin-top:48px;font-size:14px}
footer a{color:#fff}
.demo{font-size:12px;color:var(--sub);text-align:center;padding:8px}
@media(max-width:760px){.hgrid,.edit,.plans,.two,.join{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:minmax(0,1fr)}.pv{position:static}.hd nav a.opt{display:none}}

@media(prefers-reduced-motion:reduce){.ecard,.toast{transition:none}}
</style>
</head>

  });
  hits.sort((a,b)=>a.e.date.localeCompare(b.e.date));
  const near=hits.filter(h=>h.e.pref!=='全国');
  return `<div class="wrap band"><div class="crumb"><a href="#home">トップ</a> ＞ あなたの選挙</div>
  <h1 style="font-size:clamp(26px,4vw,38px);margin-top:8px">${esc(pref)}${esc(city)}の選挙</h1>
  <p class="meta">〒${zip.slice(0,3)}-${zip.slice(3)}　${esc(pref+city+(town||''))}</p>
  ${near.length?`<div class="count"><b>${near.length}</b><div><strong>2027年末までに予定されている選挙</strong><br><span class="meta">あなたの住所で投票できる選挙です（県の選挙と${esc(mu)}の選挙）。</span></div></div>`:`<div class="notice"><strong>${esc(pref+mu)}で、2027年末までに予定されている選挙は今のところ掲載されていません。</strong><br>日程が決まりしだい、毎日の更新で追加します。<a href="#search" data-q="${esc(pref)}">${esc(pref)}のほかの選挙を見る</a></div>`}
  <div style="display:grid;gap:12px">${hits.map(h=>`<div>${ecard(h.e)}${h.dn?`<p class="meta" style="margin:6px 4px 0">${h.e.pref==='全国'?'':'あなたの選挙区：'}${esc(h.dn)}</p>`:''}</div>`).join('')}</div>
  ${ad()}
  <p class="src">住所の判定：郵便番号検索API（zipcloud）。選挙区は市区町村単位で判定しています。政令市の区や一部の地域で選挙区が分かれる場合は、選挙管理委員会の案内をご確認ください。</p></div>`;
}
function route(){
  const h=location.hash.slice(1)||'home',app=$('#app');
  const e=E.find(x=>x.id===h);
  app.innerHTML=h==='plans'?plans():h==='edit'?edit():h==='search'?search():h==='area'?area():e?election(e):C[h]?cand(h):home();
  document.querySelectorAll('.hd nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===(['plans','edit','search'].includes(h)?h:'home')));
  document.title=(e?e.name:C[h]?C[h].n:h==='plans'?'掲載プラン':h==='edit'?'陣営ページの編集':h==='search'?'検索':h==='area'&&AREA?AREA.pref+AREA.city+'の選挙':'投票日和')+'｜投票日和';
  if(h==='edit')renderPrev();
  window.scrollTo(0,0);closeD();
}
function closeD(){const d=$('#drawer');d.hidden=true;$('#mbtn').setAttribute('aria-expanded','false')}
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');if(g){const t=document.getElementById(g.dataset.go);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});}
  const s=ev.target.closest('#seg button');if(s){pv=s.dataset.p;route();}
  if(ev.target.closest('#mbtn')){const d=$('#drawer');d.hidden=!d.hidden;$('#mbtn').setAttribute('aria-expanded',String(!d.hidden));return;}
  const to=ev.target.closest('[data-to]');if(to){ev.preventDefault();const go=()=>{const t=document.getElementById(to.dataset.to);if(t)t.scrollIntoView();};if((location.hash.slice(1)||'home')!=='home'){location.hash='home';setTimeout(go,50);}else{closeD();go();}return;}
  const m=ev.target.closest('[data-m]');if(m){calM=m.dataset.m;const y=scrollY;route();scrollTo(0,y);return;}
  const qb=ev.target.closest('[data-q]');if(qb){q=qb.dataset.q;qt='';location.hash==='#search'?route():location.hash='search';return;}
  const tb=ev.target.closest('[data-t]');if(tb){qt=tb.dataset.t;if(!location.hash.startsWith('#search'))q='';location.hash==='#search'?route():location.hash='search';return;}
  if(ev.target.closest('[data-art]'))toast('記事ページは次の段階で作成します');
});
document.addEventListener('input',ev=>{if(ev.target.closest('#ef'))renderPrev();});
document.addEventListener('submit',ev=>{ev.preventDefault();
  if(ev.target.id==='zipf'){const raw=$('#zip').value.trim();const v=raw.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,'');
    if(v.length===7){lookupZip(v);}else if(raw&&!/^[\d０-９\-ー－\s]+$/.test(raw)){q=raw;qt='';location.hash==='#search'?route():location.hash='search';}else{toast('郵便番号を7桁で入力してください（市区町村名でも探せます）');}}
  else if(ev.target.id==='sf'){q=$('#sq').value;route();}
  else if(ev.target.id==='joinf'){const z=$('#j-zip').value.replace(/\D/g,''),m=$('#j-mail').value;if(z.length!==7||!m.includes('@')){toast('郵便番号7桁とメールアドレスを入力してください');return;}toast('登録しました（プロトタイプのため実際には登録されません）');}
  else toast('保存しました（プロトタイプのため実際には保存されません）');
});
addEventListener('hashchange',route);
try{document.getElementById('upd').textContent=fmt(UPDATED)}catch(e){}
route();
}
</script>
</body>
</html>
